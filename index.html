<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ForensicAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/lucide-static/font/lucide.css">
</head>

<body>
  <div class="app">

    <!-- Header -->
    <h1 class="title">
      <i class="lucide lucide-shield-alert neon-green"></i>
      Forensic<span class="accent">AI</span>
    </h1>

    <!-- Upload -->
    <label class="upload-btn">
      LOAD MEDIA
      <input type="file" id="media-input" accept="image/*,video/*">
    </label>

    <!-- Preview -->
    <div id="preview-container"></div>

    <!-- Action -->
    <button class="action-btn" id="scan-btn">
      DECONSTRUCT
      <i class="lucide lucide-zap"></i>
    </button>

    <!-- Analyzing Section -->
    <div class="analyzing" id="analyzing-section" style="display:none;">
      <p class="progress" id="progress-text">0%</p>

      <div id="log-container">
        <div class="log">Initializing forensic engine...</div>
      </div>
    </div>

    <!-- Results -->
    <div class="results" id="results-section" style="display:none;">
      <h2 class="result-title neon-red">MANIPULATION DETECTED</h2>

      <div class="scores">
        <div class="score">
          <p>Manipulation</p>
          <h3 id="manip-score">0%</h3>
        </div>
        <div class="score">
          <p>Credibility</p>
          <h3 id="cred-score">0%</h3>
        </div>
      </div>

      <div class="buttons">
        <button class="export-btn" id="export-btn">
          <i class="lucide lucide-download"></i>
          EXPORT REPORT
        </button>

        <button class="reset-btn" id="reset-btn">
          <i class="lucide lucide-refresh-cw"></i>
          RESET
        </button>
      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
